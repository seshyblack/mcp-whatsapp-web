name: WhatsApp catalogue validation

on:
  push:
    branches:
      - shyann/whatsapp-catalog-tools
  pull_request:
    branches:
      - shyann/render-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: TypeScript compilation
        run: npm run build
      # The full inherited suite has unrelated legacy failures in Baileys session
      # ownership and HTTP OAuth lifecycle tests. Do not hide those failures by
      # claiming all upstream tests pass; validate the changed catalogue path
      # and existing registered MCP tools as a release gate.
      - name: Catalogue, MCP and quoted-message regression tests
        run: npx vitest run test/catalog.test.ts test/tools.test.ts test/baileys-mcp.test.ts test/auction.test.ts
